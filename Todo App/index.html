<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO list App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section>
        <div class="card">
            <h1>TODO</h1>
            <div class="eventadd">
                <input type="text" id="input" placeholder="Enter your task here">
                <button id="addBtn">Add Task</button>
            </div>
            <div class="status">
                <p class="alltasks">All Tasks</p>
                <p class="active">Active Tasks</p>
                <p class="completed">Completed Tasks</p>
            </div>
            <div class="tasks">
                <ul id="taskList">
                <!-- <li>
                    <input type="checkbox" />
                    <span>Example Task 1</span>
                    <button class="delete">🗑️</button>
                </li> -->
                </ul>

                <ul class="active-list">
                <!-- <li>
                    <input type="checkbox" />
                    <span>Example Active Task</span>
                    <button class="delete">🗑️</button>
                </li> -->
                </ul>

                <ul class="completed-list">
                <!-- <li>
                    <input type="checkbox" checked />
                    <span>Example Completed Task</span>
                    <button class="delete">🗑️</button>
                </li>
                </ul>  -->
            </div>

        </div>
    </section>
    <script src="app.js"></script>
</body>
</html>
